<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Simulador Concursos">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Simulador — Concursos Públicos Angola 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --bg2: #1e293b; --border: #334155;
    --fg: #e2e8f0; --fg2: #94a3b8; --accent: #facc15;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh;
    display: flex; justify-content: center; padding: 24px 16px;
  }
  .container { max-width: 820px; width: 100%; }
  h1 { font-size: 1.5rem; color: var(--accent); text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: var(--fg2); font-size: .85rem; margin-bottom: 24px; }
  .section { margin-bottom: 8px; }
  .section-title {
    font-size: 1rem; color: var(--fg2); text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 0; display: flex; align-items: center; gap: 8px;
    cursor: pointer; user-select: none; padding: 12px 0; border-bottom: 1px solid var(--border);
    transition: color .15s;
  }
  .section-title:hover { color: var(--accent); }
  .section-title .chevron {
    font-size: .7rem; transition: transform .2s; color: var(--fg2);
  }
  .section-title .chevron.open { transform: rotate(90deg); }
  .section-grid {
    overflow: hidden; transition: max-height .3s ease, opacity .25s ease, margin .25s ease;
    max-height: 2000px; opacity: 1; margin: 12px 0 20px;
  }
  .section-grid.collapsed {
    max-height: 0; opacity: 0; margin: 0;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; cursor: pointer; transition: .2s;
    display: flex; flex-direction: column; position: relative; overflow: hidden;
  }
  .card:hover {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
  }
  .card.disabled { opacity: .5; cursor: not-allowed; }
  .card.disabled:hover { transform: none; border-color: var(--border); box-shadow: none; }
  .card-container { cursor: default; }
  .card-container:hover { transform: none; border-color: var(--border); box-shadow: none; }
  .card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .card-icon {
    width: 40px; height: 40px; border-radius: 10px; display: flex;
    align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
  }
  .card-icon.sic { background: rgba(59,130,246,.15); }
  .card-icon.pn { background: rgba(239,68,68,.15); }
  .card-icon.sme { background: rgba(245,158,11,.15); }
  .card-icon.sp { background: rgba(139,92,246,.15); }
  .card-icon.spcb { background: rgba(249,115,22,.15); }
  .card-icon.saude-enf { background: rgba(16,185,129,.15); }
  .card-icon.saude-med { background: rgba(6,182,212,.15); }
  .card-icon.edu { background: rgba(236,72,153,.15); }
  .card-icon.edu-rg { background: rgba(20,184,166,.15); }
  .card-icon.saude-tdt { background: rgba(139,92,246,.15); }
  .card-icon.saude-apoio { background: rgba(249,115,22,.15); }
  .card-icon.saude-rg { background: rgba(99,102,241,.15); }
  .card-icon.saude-as { background: rgba(236,72,153,.15); }
  .card-icon.psico { background: rgba(139,92,246,.2); }
  .card-icon.aptidao { background: rgba(220,38,38,.15); }
  .card-nome { font-size: .95rem; font-weight: 600; }
  .card-sigla { font-size: .7rem; color: var(--fg2); }
  .card-tags { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0 8px; }
  .card-tag {
    font-size: .65rem; padding: 2px 8px; border-radius: 10px;
    background: var(--bg); color: var(--fg2); border: 1px solid var(--border);
  }
  .card-desc { font-size: .75rem; color: var(--fg2); line-height: 1.4; }
  .card-indisponivel {
    position: absolute; top: 8px; right: 8px;
    font-size: .6rem; background: var(--bg); color: var(--fg2);
    padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border);
  }
  .card-toggle {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: .75rem; color: var(--accent); cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .card-toggle:hover { opacity: .8; }
  .child-chevron { font-size: .6rem; transition: transform .2s; }
  .child-chevron.open { transform: rotate(90deg); }
  .card-children {
    display: none; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  }
  .card-children.open { display: grid; }
  .child-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; cursor: pointer; transition: .15s;
  }
  .child-card:hover { border-color: var(--accent); }
  .child-card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .child-card-icon { font-size: 1rem; }
  .child-card-nome { font-size: .8rem; font-weight: 600; }
  .child-card-questoes { font-size: .65rem; color: var(--accent); }
  .child-card-desc { font-size: .65rem; color: var(--fg2); margin-top: 2px; }
  .footer {
    text-align: center; color: var(--fg2); font-size: .75rem;
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .card[data-id="psicotecnico"] {
    border-color: rgba(139,92,246,.4);
    box-shadow: 0 0 20px rgba(139,92,246,.12), inset 0 0 40px rgba(139,92,246,.03);
  }
  .card[data-id="psicotecnico"]:hover {
    border-color: #a78bfa;
    box-shadow: 0 0 30px rgba(139,92,246,.25);
  }
  .card[data-id="minint-sic"],
  .card[data-id="minint-pn"],
  .card[data-id="minint-sme"],
  .card[data-id="minint-sp"],
  .card[data-id="minint-spcb"] {
    border-color: rgba(59,130,246,.2);
    cursor: default;
  }
  .card[data-id="minint-sic"]:hover,
  .card[data-id="minint-pn"]:hover,
  .card[data-id="minint-sme"]:hover,
  .card[data-id="minint-sp"]:hover,
  .card[data-id="minint-spcb"]:hover {
    border-color: rgba(59,130,246,.4);
    box-shadow: 0 0 25px rgba(59,130,246,.1);
    transform: translateY(-2px);
  }
  .card[data-id^="saude-"] {
    border-color: rgba(16,185,129,.2);
    cursor: default;
  }
  .card[data-id^="saude-"]:hover {
    border-color: rgba(16,185,129,.4);
    box-shadow: 0 0 25px rgba(16,185,129,.1);
    transform: translateY(-2px);
  }
  .card[data-id^="educacao-"] {
    border-color: rgba(236,72,147,.2);
    cursor: default;
  }
  .card[data-id^="educacao-"]:hover {
    border-color: rgba(236,72,147,.4);
    box-shadow: 0 0 25px rgba(236,72,147,.1);
    transform: translateY(-2px);
  }
  .badge-guia {
    position: absolute; top: 8px; right: 8px;
    font-size: .6rem; font-weight: 700; color: #fff;
    background: var(--accent2); padding: 2px 7px; border-radius: 6px;
  }
  .card[data-id="aptidao-fisica"] {
    border-color: rgba(220,38,38,.4);
    box-shadow: 0 0 20px rgba(220,38,38,.12), inset 0 0 40px rgba(220,38,38,.03);
    cursor: default;
  }
  .card[data-id="aptidao-fisica"]:hover {
    border-color: #ef4444;
    box-shadow: 0 0 30px rgba(220,38,38,.25);
    transform: translateY(-2px);
  }
  .card[data-id="aptidao-fisica"] .badge-peso {
    display: inline-flex; align-items: center; gap: 3px;
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    color: #fff; padding: 2px 8px; border-radius: 8px;
    font-size: .65rem; font-weight: 700; margin-left: 6px;
  }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; }
  .card-actions a {
    flex: 1; display: inline-flex; align-items: center; justify-content: center;
    gap: 4px; padding: 8px 12px; border-radius: 8px;
    font-size: .75rem; font-weight: 600; text-decoration: none;
    transition: .15s; cursor: pointer;
  }
  .card-actions .btn-study {
    background: rgba(220,38,38,.12); color: #fca5a5;
    border: 1px solid rgba(220,38,38,.25);
  }
  .card-actions .btn-study:hover { background: rgba(220,38,38,.2); }
  .card-actions .btn-sim {
    background: #dc2626; color: #fff;
  }
  .card-actions .btn-sim:hover { background: #b91c1c; }
  .card[data-id="psicotecnico"]::after {
    content: ''; position: absolute; top: 10px; right: 10px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #a78bfa; box-shadow: 0 0 6px #a78bfa;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  .card[data-id="aptidao-fisica"]::after {
    content: '55%'; position: absolute; top: 8px; right: 8px;
    font-size: .6rem; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    padding: 2px 6px; border-radius: 6px;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .6; transform: scale(1.1); }
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Simulador de Provas</h1>
  <p class="sub">Concursos Públicos Angola 2026 · Selecciona o teu concurso</p>

  <div id="catalogo"></div>

  <div class="footer">
    Prepara-te para o concurso · candidaturas.minint.ao<br>
    <span style="font-size:.65rem">No Safari: Partilha → Adicionar ao Ecrã de Início</span>
  </div>
</div>

<script src="dados/index.js"></script>
<script>
function renderCatalog() {
  var container = document.getElementById("catalogo");

  var children = {};
  var tops = [];
  CATALOGO.forEach(function(c) {
    if (c.parentId) {
      if (!children[c.parentId]) children[c.parentId] = [];
      children[c.parentId].push(c);
    } else {
      tops.push(c);
    }
  });

  var ministerios = {};
  tops.forEach(function(c) {
    if (!ministerios[c.ministerio]) ministerios[c.ministerio] = [];
    var childCount = (children[c.id] || []).length;
    ministerios[c.ministerio].push({ entry: c, childCount: childCount });
  });

  var iconeClasses = {
    "minint-sic": "sic", "minint-pn": "pn", "minint-sme": "sme",
    "minint-sp": "sp", "minint-spcb": "spcb",
    "saude-enfermagem": "saude-enf", "saude-medicina": "saude-med",
    "saude-tdt": "saude-tdt",
    "saude-apoio-hospitalar": "saude-apoio",
    "saude-regime-geral": "saude-rg", "saude-assistentes-sociais": "saude-as",
    "educacao-professores": "edu",
    "educacao-regime-geral": "edu-rg",
    "educacao-disciplinas": "edu",
    "psicotecnico": "psico",
    "aptidao-fisica": "aptidao"
  };

  // LER ESTADO PERSISTIDO DO LOCALSTORAGE
  var activeMinisterio = localStorage.getItem('active_ministerio');

  var html = "";
  Object.entries(ministerios).forEach(function(_ref) {
    var ministerio = _ref[0], items = _ref[1];
    var mKey = ministerio.replace(/\s+/g, '_');
    
    // Se houver um ministério guardado no localStorage, expande apenas esse.
    // Caso contrário, o padrão é o Ministério do Interior aberto e os outros fechados.
    var open = false;
    if (activeMinisterio) {
      open = (activeMinisterio === mKey);
    } else {
      open = (ministerio === "Ministério do Interior");
    }

    html += '<div class="section">' +
      '<div class="section-title" onclick="toggleMinisterio(this)" data-target="' + mKey + '">' +
        '<span class="chevron ' + (open ? 'open' : '') + '">\u25B6</span> ' + ministerio +
      '</div>' +
      '<div class="section-grid ' + (open ? '' : 'collapsed') + '" id="grid-' + mKey + '">' +
      '<div class="grid">';

    items.forEach(function(item) {
      var c = item.entry;
      var hasChildren = item.childCount > 0;
      var disp = c.disponivel !== false;
      var isContainer = c.container;
      var q = c.questoes || 0;

      if (isContainer) {
        var childList = children[c.id] || [];
        html += '<div class="card card-container" data-id="' + c.id + '">' +
          '<div class="card-top">' +
            '<div class="card-icon ' + (iconeClasses[c.id] || '') + '">' + c.icone + '</div>' +
            '<div>' +
              '<div class="card-nome">' + c.orgao + '</div>' +
              '<div class="card-sigla">' + c.sigla + ' \u00B7 Disciplinas da especialidade</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-tags">' + (c.tags || []).map(function(t) { return '<span class="card-tag">' + t + '</span>'; }).join('') + '</div>' +
          '<div class="card-desc">' + (c.descricao || '') + '</div>' +
          '<div class="card-toggle" onclick="event.stopPropagation();toggleChildren(\'' + c.id + '\')">' +
            '<span class="child-chevron" id="chevron-' + c.id + '">\u25B6</span> ' +
            '<span id="label-' + c.id + '">Mostrar especialidades (' + childList.length + ')</span>' +
          '</div>' +
          '<div class="card-children" id="children-' + c.id + '">';
        childList.forEach(function(ch) {
          html += '<div class="child-card" onclick="openSimulador(\'' + ch.id + '\')" data-id="' + ch.id + '">' +
            '<div class="child-card-top">' +
              '<div class="child-card-icon">' + (ch.icone || '\u{1F4D6}') + '</div>' +
              '<div class="child-card-nome">' + (ch.orgao || ch.id) + '</div>' +
            '</div>' +
            '<div class="child-card-questoes" data-qid="' + ch.id + '">\u2B50 ' + (ch.questoes || 0) + ' quest\u00f5es</div>' +
            '<div class="child-card-desc">' + (ch.descricao || '') + '</div>' +
          '</div>';
        });
        html += '</div></div>';
      } else {
        var childList = children[c.id] || [];
        var isAptFis = c.id === 'aptidao-fisica';
        var GUIDE_MAP = {
          'minint-sic':'guia_estudo_minint2026.html?orgao=sic',
          'minint-pn':'guia_estudo_minint2026.html?orgao=pn',
          'minint-sme':'guia_estudo_minint2026.html?orgao=sme',
          'minint-sp':'guia_estudo_minint2026.html?orgao=sp',
          'minint-spcb':'guia_estudo_minint2026.html?orgao=spcb',
          'saude-enfermagem':'guia_estudo_minsa2026.html?carreira=enfermagem',
          'saude-medicina':'guia_estudo_minsa2026.html?carreira=medicina',
          'saude-tdt':'guia_estudo_minsa2026.html?carreira=tdt',
          'saude-apoio-hospitalar':'guia_estudo_minsa2026.html?carreira=apoio',
          'saude-regime-geral':'guia_estudo_minsa2026.html?carreira=regime-geral',
          'saude-assistentes-sociais':'guia_estudo_minsa2026.html?carreira=assistentes-sociais',
          'educacao-professores':'guia_estudo_med2026.html?carreira=professores',
          'educacao-regime-geral':'guia_estudo_med2026.html?carreira=regime-geral'
        };
        var guideLink = GUIDE_MAP[c.id];
        var hasButtons = isAptFis || guideLink;
        html += '<div class="card' + (disp ? '' : ' disabled') + '" data-id="' + c.id + '"' + (hasButtons || !disp ? '' : " onclick=\"openSimulador('" + c.id + "')\"") + '>' +
          (!disp ? '<span class="card-indisponivel">Breve</span>' : '') +
          (guideLink ? '<span class="badge-guia">📖 Guia</span>' : '') +
          '<div class="card-top">' +
            '<div class="card-icon ' + (iconeClasses[c.id] || '') + '">' + c.icone + '</div>' +
            '<div>' +
              '<div class="card-nome">' + c.orgao + '</div>' +
              '<div class="card-sigla">' + c.sigla + ' \u00B7 ' + (c.vagas || 0).toLocaleString('pt-PT') + ' vagas</div>' +
            '</div>' +
          '</div>' +
          '<div class="card-tags">' + (c.tags || []).map(function(t) { return '<span class="card-tag">' + t + '</span>'; }).join('') + '</div>' +
          '<div class="qcount" data-qid="' + c.id + '" style="margin-top:4px;margin-bottom:2px;font-size:.75rem;color:var(--accent)">\u2B50 ' + q + ' quest\u00f5es</div>' +
          '<div class="card-desc">' + (c.descricao || '') + '</div>' +
          (isAptFis ? '<div class="card-actions"><a href="guia_estudo_aptidao.html" class="btn-study">📖 Ver Manual</a><a href="simulador_prova_MININT.html?id=aptidao-fisica" class="btn-sim">▶️ Simular Prova</a></div>' : '') +
          (guideLink ? '<div class="card-actions"><a href="' + guideLink + '" class="btn-study">📖 Ver Manual</a><a href="simulador_prova_MININT.html?id=' + c.id + '" class="btn-sim">▶️ Simular Prova</a></div>' : '');

        if (hasChildren) {
          html += '<div class="card-toggle" onclick="event.stopPropagation();toggleChildren(\'' + c.id + '\')">' +
            '<span class="child-chevron" id="chevron-' + c.id + '">\u25B6</span> ' +
            '<span id="label-' + c.id + '">Mostrar especialidades (' + childList.length + ')</span>' +
          '</div>' +
          '<div class="card-children" id="children-' + c.id + '">';
          childList.forEach(function(ch) {
            var shortName = (ch.orgao || '').replace(/^TDT \u2014 /, '');
            html += '<div class="child-card" onclick="event.stopPropagation();openSimulador(\'' + ch.id + '\')" data-id="' + ch.id + '">' +
              '<div class="child-card-top">' +
                '<div class="child-card-icon">' + (ch.icone || '\u{1F4D6}') + '</div>' +
                '<div class="child-card-nome">' + (shortName || ch.id) + '</div>' +
              '</div>' +
              '<div class="child-card-questoes" data-qid="' + ch.id + '">\u2B50 ' + (ch.questoes || 0) + ' quest\u00f5es</div>' +
              '<div class="child-card-desc">' + (ch.descricao || '') + '</div>' +
            '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      }
    });
    html += '</div></div></div>';
  });
  container.innerHTML = html;
}

function openSimulador(id) {
  window.location.href = 'simulador_prova_MININT.html?id=' + id;
}

function toggleChildren(id) {
  var grid = document.getElementById('children-' + id);
  var chevron = document.getElementById('chevron-' + id);
  var label = document.getElementById('label-' + id);
  if (!grid) return;
  var isOpen = grid.classList.contains('open');
  if (isOpen) {
    grid.classList.remove('open');
    grid.style.maxHeight = '';
    if (chevron) chevron.classList.remove('open');
    if (label) label.textContent = label.textContent.replace('Ocultar', 'Mostrar');
  } else {
    grid.classList.add('open');
    if (chevron) chevron.classList.add('open');
    if (label) label.textContent = label.textContent.replace('Mostrar', 'Ocultar');
  }
}

function toggleMinisterio(el) {
  var key = el.dataset.target;
  var grid = document.getElementById('grid-' + key);
  if (!grid) return;
  var isOpen = !grid.classList.contains('collapsed');
  
  // Fecha todas as secções
  document.querySelectorAll('.section-grid').forEach(function(g) {
    g.classList.add('collapsed');
  });
  document.querySelectorAll('.chevron').forEach(function(c) {
    c.classList.remove('open');
  });
  
  if (!isOpen) {
    grid.classList.remove('collapsed');
    el.querySelector('.chevron').classList.add('open');
    // Salva a escolha do utilizador no localStorage
    localStorage.setItem('active_ministerio', key);
  } else {
    // Se o utilizador fechou a secção ativa, limpa o localStorage
    localStorage.removeItem('active_ministerio');
  }
}

// ===== DYNAMIC QUESTION COUNTS =====
var BONUS_SCRIPTS_MAP = {
  'Q_BONUS_minint_concurso': 'dados/minint-concurso-bonus.js',
  'Q_BONUS_minint_sic': 'dados/minint-sic-bonus.js'
};

var SCRIPTS_BY_CONCURSO_MAP = {
  'educacao-disciplina-informatica': [
    'dados/educacao-disciplina-informatica/tic.js',
    'dados/educacao-disciplina-informatica/tlp.js',
    'dados/educacao-disciplina-informatica/redes.js',
    'dados/educacao-disciplina-informatica/seac.js',
    'dados/educacao-disciplina-informatica/trei.js',
    'dados/educacao-disciplina-informatica/index.js'
  ]
};

var _FILE_COUNTS = {};

function _fetchCount(src) {
  if (_FILE_COUNTS[src] !== undefined) return Promise.resolve(_FILE_COUNTS[src]);
  return fetch(src).then(function(r) { return r.text(); }).then(function(text) {
    var n = (text.match(/"tema":/g) || []).length;
    _FILE_COUNTS[src] = n;
    return n;
  }).catch(function() {
    _FILE_COUNTS[src] = 0;
    return 0;
  });
}

function _getScripts(meta) {
  if (meta.id === 'psicotecnico') return ['dados/base-psicotecnico.js'];
  if (meta.id === 'aptidao-fisica') return ['dados/base-aptidao-fisica.js'];
  var s = [];
  if (meta.base) s.push('dados/' + meta.base + '.js');
  s.push('dados/base-geral.js');
  if (meta.ministerio === 'Ministério do Interior') {
    s.push('dados/base-geral-minint.js');
    s.push('dados/base-geral-cultura.js');
    s.push('dados/base-actualidade.js');
    s.push('dados/base-conduta.js');
    s.push('dados/base-portal.js');
    s.push('dados/base-historia-minint.js');
    s.push('dados/base-aptidao.js');
    s.push('dados/base-raciocinio.js');
  }
  if (meta.ministerio === 'Ministério da Saúde' || meta.ministerio === 'Ministério da Educação') {
    s.push('dados/base-geral-cultura.js');
  }
  if (meta.ministerio === 'Ministério da Educação') s.push('dados/educacao-base-lp.js');
  if (SCRIPTS_BY_CONCURSO_MAP[meta.id]) {
    SCRIPTS_BY_CONCURSO_MAP[meta.id].forEach(function(x) { if (s.indexOf(x) === -1) s.push(x); });
  } else {
    s.push('dados/' + meta.id + '.js');
  }
  if (meta.bonus) {
    meta.bonus.forEach(function(v) {
      if (BONUS_SCRIPTS_MAP[v] && s.indexOf(BONUS_SCRIPTS_MAP[v]) === -1) s.push(BONUS_SCRIPTS_MAP[v]);
    });
  }
  return s;
}

function _computeEntryCount(meta) {
  var total = 0;
  _getScripts(meta).forEach(function(src) { total += _FILE_COUNTS[src] || 0; });
  return total;
}

function updateCounts() {
  var unique = [], all = [];
  CATALOGO.forEach(function(c) {
    all = all.concat(_getScripts(c));
  });
  all.forEach(function(s) { if (unique.indexOf(s) === -1) unique.push(s); });

  Promise.all(unique.map(function(s) { return _fetchCount(s); })).then(function() {
    CATALOGO.forEach(function(c) {
      c._dynCount = _computeEntryCount(c);
    });
    _applyCounts();
  });
}

function _applyCounts() {
  CATALOGO.forEach(function(c) {
    var n = c._dynCount || 0;
    if (n === 0) return;
    if (c.parentId) {
      var el = document.querySelector('.child-card-questoes[data-qid="' + c.id + '"]');
      if (el) el.textContent = '\u2B50 ' + n + ' quest\u00f5es';
    } else {
      var el = document.querySelector('.qcount[data-qid="' + c.id + '"]');
      if (el) el.textContent = '\u2B50 ' + n + ' quest\u00f5es';
    }
  });
}

renderCatalog();
updateCounts();
</script>
</body>
</html>
